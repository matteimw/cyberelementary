<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Free for a limited time">
  <defs>
    <path id="topArc" d="M 34,110 A 76,76 0 0 1 186,110" fill="none" />
    <path id="bottomArc" d="M 34,116 A 76,76 0 0 0 186,116" fill="none" />
  </defs>

  <!-- outer thin ring -->
  <circle cx="110" cy="110" r="108" fill="none" stroke="#c81e1e" stroke-width="2" opacity="0.55" />

  <!-- red band -->
  <circle cx="110" cy="110" r="100" fill="#b81c1c" stroke="#8f1414" stroke-width="3" />

  <!-- inner black circle -->
  <circle cx="110" cy="110" r="66" fill="#141414" stroke="#e2b53c" stroke-width="3" />

  <!-- curved band text -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#f6f1e2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">EBOOK FREE</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14" letter-spacing="1.4" fill="#f6f1e2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">FREE FOR LIMITED TIME</textPath>
  </text>

  <!-- small stars on either side of the band -->
  <text x="18" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f6f1e2" text-anchor="middle">★</text>
  <text x="202" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f6f1e2" text-anchor="middle">★</text>

  <!-- FREE center text, slightly rotated for a "stamped" feel -->
  <g transform="rotate(-8 110 110)">
    <text x="110" y="123" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#e6231e" text-anchor="middle" stroke="#7a0f0f" stroke-width="0.5">FREE</text>
  </g>
</svg>
